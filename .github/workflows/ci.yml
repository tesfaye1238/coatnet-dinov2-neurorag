name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch, no data, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check src tests scripts app
      - name: Tests with coverage
        run: pytest -q --cov=neurofusion --cov-report=term-missing --cov-report=xml
      - name: Numerical audit regenerates
        run: python -m neurofusion.cli audit-manuscript --out /tmp/numerical_audit.md
      - name: Secret and forbidden-file scan
        run: |
          git add -A
          python scripts/prepare_publication.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
