# Reported ablations (Table 5) use proposed.yaml training settings; only the model name changes:
#   coatnet_only | dinov2_only | concat_no_attention | concat_se_r16 | sum_se_r8 | proposed
# New controls (NOT in the manuscript): concat_mlp_control (capacity-comparable, no multiplicative gating).
