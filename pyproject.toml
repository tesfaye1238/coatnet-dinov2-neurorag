[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofusion"
version = "0.1.0"
description = "Manuscript-based implementation of a CoAtNet-DINOv2 brain MRI classifier and a retrieval-augmented contextual reporting module (research code)."
readme = "README.md"
requires-python = ">=3.10"
# No license is selected on behalf of the authors; see README.
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0",
  "numpy>=1.24,<2.3",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pillow>=13.0; python_version >= '3.11'",
  "pillow>=10.0; python_version < '3.11'",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
mat = ["h5py>=3.8"]
rag = ["qdrant-client>=1.9", "sentence-transformers>=2.7", "transformers>=4.43", "pypdf>=6.21.4"]
rag-eval = ["bert-score>=0.3.13"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "build>=1.2", "h5py>=3.8", "qdrant-client>=1.9", "pypdf>=6.21.4"]

[project.scripts]
neurofusion = "neurofusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that download weights or need network (deselected in CI)",
]

[tool.coverage.run]
source = ["neurofusion"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501", "B905"]
